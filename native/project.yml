name: BuildersPro
options:
  bundleIdPrefix: com.stanrobinson
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "6.7.2"
    CURRENT_PROJECT_VERSION: "53"
    DEVELOPMENT_TEAM: 44HA83UCKJ
    CODE_SIGN_STYLE: Automatic
targets:
  BuildersPro:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stanrobinson.builderspro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info-extra.plist
        INFOPLIST_KEY_CFBundleDisplayName: BuildersPro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Put your BuildersPro appointments in a BuildersPro calendar."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Put your BuildersPro appointments in a BuildersPro calendar."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock BuildersPro with Face ID."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Show your job-site location and local weather on the Home screen."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record voice notes for your jobs."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn your voice into job notes."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of job sites, measure with AR, and match colors."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos to your jobs and punch items."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save job photos and reports to your Photos."
        CODE_SIGN_ENTITLEMENTS: Config/BuildersPro.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}
